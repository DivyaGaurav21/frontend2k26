<body>
 <h1>stop watch</h1>
    <div class="timer">
        <span id="hours">00</span> : 
        <span id="minutes">00</span> : 
        <span id="seconds">00</span> 
    </div>
    
    <div>
        <button onclick="stopTimer()">stop</button>
        <button onclick="startTimer()">start</button>
        <button onclick="restartTimer()">restart</button>
    </div>

</body>
